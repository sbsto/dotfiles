[core]
    pager = delta
[interactive]
    diffFilter = delta --color-only
[delta]
    navigate = true
[merge]
    conflictstyle = zdiff3
[user]
    name = Sam Brownstone
    email = brownstone@hey.com
    username = sbsto

[pull]
    rebase = true
[push]
    default = current
[branch]
    autoSetupRemote = true
[init]
    defaultBranch = main

[gpg]
  format = ssh
[gpg "ssh"]
  defaultKeyCommand = ssh-add -L
  allowedSignersFile = ~/.config/git/allowed_signers

[commit]
  gpgsign = true

[includeIf "gitdir:/Users/samuelbrownstone/"]
  path = ~/dotfiles/config/git/air.ini

[includeIf "gitdir:/Users/sambrownstone/"]
  path = ~/dotfiles/config/git/work.ini
